<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<title>Nishant Kumar — ML Engineer Portfolio</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div class="progress-bar"><div class="progress-fill"></div></div>

<div class="aurora-bg">
    <div class="blob" style="width:600px;height:600px;background:radial-gradient(circle,#1e293b,#334155);top:-100px;left:-100px;--d:20s;--tx:60px;--ty:40px;--s:1.1"></div>
    <div class="blob" style="width:500px;height:500px;background:radial-gradient(circle,#7c3aed,#a855f7);top:30%;right:-80px;--d:16s;--tx:-50px;--ty:60px;--s:1.15"></div>
    <div class="blob" style="width:450px;height:450px;background:radial-gradient(circle,#ec4899,#f97316);bottom:10%;left:15%;--d:22s;--tx:70px;--ty:-40px;--s:1.08"></div>
    <div class="blob" style="width:380px;height:380px;background:radial-gradient(circle,#06b6d4,#10b981);bottom:25%;right:20%;--d:18s;--tx:-40px;--ty:50px;--s:1.12"></div>
    <div class="blob" style="width:320px;height:320px;background:radial-gradient(circle,#334155,#1e293b);top:50%;left:40%;--d:14s;--tx:30px;--ty:-60px;--s:1.2"></div>

<div id="loader">
  <div class="loader-logo">NK/</div>
  <div class="loader-track"><div class="loader-fill" id="lfill"></div></div>
  <div class="loader-txt" id="ltxt">LOADING</div>
</div>

<div id="root"></div>

<script type="text/babel" src="script.js"></script>

</body>
</html>
