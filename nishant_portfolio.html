<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<title>Nishant Kumar — Portfolio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:#050814;color:#e2e8f0;overflow-x:hidden;cursor:none}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0a0f1e}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00d4ff,#8b5cf6);border-radius:4px}

/* ── Custom Cursor ── */
#cursor{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#8b5cf6);position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transition:transform .08s;box-shadow:0 0 12px #00d4ff88}
#cursor-ring{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(0,212,255,.4);position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transition:transform .18s ease}

/* ── Aurora / Background Blobs ── */
.aurora-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(0,80,120,.35),transparent)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:blobmove var(--d,18s) ease-in-out infinite alternate}
@keyframes blobmove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--tx,40px),var(--ty,30px)) scale(var(--s,1.12))}}

/* ── Grid Overlay ── */
.aurora-bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

/* ── Progress Bar ── */
.progress-bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:9999;background:rgba(255,255,255,.05)}
.progress-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#8b5cf6,#e040fb);width:0%;transition:width .1s;box-shadow:0 0 8px #00d4ff}

/* ── Nav ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 48px;display:flex;align-items:center;justify-content:space-between;transition:all .4s}
.nav.scrolled{background:rgba(5,8,20,.82);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,212,255,.08);box-shadow:0 2px 24px rgba(0,0,0,.5)}
.nav-logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;background:linear-gradient(135deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b;text-decoration:none;transition:color .25s;cursor:none;position:relative}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1px;background:linear-gradient(90deg,#00d4ff,#8b5cf6);transition:width .3s}
.nav-links a:hover{color:#00d4ff}
.nav-links a:hover::after{width:100%}

section{position:relative;z-index:1}

/* ── Hero ── */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 40px 80px;text-align:center}
.hero-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 20px;border-radius:100px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#00d4ff;margin-bottom:28px;box-shadow:0 0 20px rgba(0,212,255,.12)}
.hero-pill-dot{width:7px;height:7px;border-radius:50%;background:#00d4ff;box-shadow:0 0 8px #00d4ff;animation:pdot 2s infinite}
@keyframes pdot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.3}}
.hero-name{font-size:clamp(52px,9vw,128px);font-weight:900;line-height:.95;letter-spacing:-.04em;margin-bottom:20px}
.hero-name .line1{background:linear-gradient(135deg,#00d4ff 0%,#8b5cf6 50%,#e040fb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,212,255,.25))}
.hero-name .line2{color:#e2e8f0}
.hero-sub{font-family:'JetBrains Mono',monospace;font-size:clamp(12px,1.6vw,16px);color:#00d4ff;letter-spacing:.14em;margin-bottom:14px;opacity:.8}
.hero-tag{font-size:clamp(15px,2vw,19px);color:#94a3b8;max-width:540px;margin:0 auto 44px;line-height:1.7;font-weight:400}

/* ── Buttons ── */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:100px;background:linear-gradient(135deg,#00d4ff,#8b5cf6);color:#fff;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:none;cursor:none;transition:all .3s;box-shadow:0 0 24px rgba(0,212,255,.35),0 8px 30px rgba(139,92,246,.25)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 36px rgba(0,212,255,.5),0 16px 40px rgba(139,92,246,.35)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:13px 30px;border-radius:100px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.25);color:#00d4ff;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:none;transition:all .3s;backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(0,212,255,.14);border-color:rgba(0,212,255,.55);transform:translateY(-3px);box-shadow:0 0 20px rgba(0,212,255,.2)}

/* ── Sections ── */
.sec{padding:100px 40px}
.sec-inner{max-width:1100px;margin:0 auto}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#00d4ff;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec-label::before{content:'';width:24px;height:2px;background:linear-gradient(90deg,#00d4ff,#8b5cf6);border-radius:2px;box-shadow:0 0 6px #00d4ff88}
.sec-title{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:12px;color:#e2e8f0}
.grad-text{background:linear-gradient(135deg,#00d4ff,#8b5cf6,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sec-sub{color:#64748b;font-size:16px;line-height:1.7;max-width:460px}

/* ── About ── */
.about-grid{display:grid;grid-template-columns:1fr 1.7fr;gap:48px;align-items:start}
.avatar-card{background:linear-gradient(135deg,rgba(0,212,255,.1),rgba(139,92,246,.1));border:1px solid rgba(0,212,255,.2);border-radius:28px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;overflow:hidden;max-width:320px;box-shadow:0 0 40px rgba(0,212,255,.1)}
.avatar-initials{font-size:64px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-chip{background:rgba(255,255,255,.04);backdrop-filter:blur(12px);border:1px solid rgba(0,212,255,.15);border-radius:16px;padding:14px 20px;text-align:center;box-shadow:0 0 16px rgba(0,0,0,.3)}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1}
.skill-row{margin-bottom:18px}
.skill-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px;color:#cbd5e1}
.skill-track{height:5px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.skill-fill{height:100%;border-radius:5px;width:0%;transition:width 1.4s cubic-bezier(.25,1,.5,1);box-shadow:0 0 8px currentColor}

/* ── Profile Section ── */
.profile-sec{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 40px 80px;position:relative;z-index:1}
.profile-inner{max-width:980px;width:100%;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:60px;align-items:center}
.profile-photo-wrap{display:flex;flex-direction:column;align-items:center;gap:28px}
.profile-photo-ring{width:280px;height:340px;border-radius:28px;padding:4px;background:linear-gradient(135deg,#00d4ff,#8b5cf6,#e040fb);position:relative;box-shadow:0 0 60px rgba(0,212,255,.35),0 0 120px rgba(139,92,246,.18);flex-shrink:0;animation:ring-spin 6s linear infinite}
@keyframes ring-spin{0%{background:linear-gradient(135deg,#00d4ff,#8b5cf6,#e040fb)}33%{background:linear-gradient(225deg,#8b5cf6,#e040fb,#00d4ff)}66%{background:linear-gradient(315deg,#e040fb,#00d4ff,#8b5cf6)}100%{background:linear-gradient(135deg,#00d4ff,#8b5cf6,#e040fb)}}
.profile-photo-inner{width:100%;height:100%;border-radius:24px;background:transparent;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;position:relative}
.profile-photo-inner img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;border-radius:0}
.profile-photo-placeholder{font-size:100px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;user-select:none;line-height:1}
.profile-status{display:inline-flex;align-items:center;gap:8px;padding:7px 20px;border-radius:100px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#00d4ff;box-shadow:0 0 18px rgba(0,212,255,.12)}
.profile-status-dot{width:7px;height:7px;border-radius:50%;background:#00d4ff;box-shadow:0 0 8px #00d4ff;animation:pdot 2s infinite;flex-shrink:0}
.profile-info{display:flex;flex-direction:column;gap:0}
.profile-greeting{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#00d4ff;margin-bottom:10px;opacity:.8}
.profile-name{font-size:clamp(40px,6vw,76px);font-weight:900;line-height:.95;letter-spacing:-.04em;margin-bottom:14px}
.profile-name .pn1{background:linear-gradient(135deg,#00d4ff,#8b5cf6,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.profile-name .pn2{color:#e2e8f0}
.profile-role{font-family:'JetBrains Mono',monospace;font-size:clamp(11px,1.4vw,15px);color:#8b5cf6;letter-spacing:.12em;margin-bottom:16px;opacity:.85}
.profile-bio{color:#94a3b8;font-size:16px;line-height:1.75;margin-bottom:32px;max-width:480px}
.profile-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.pstat{background:rgba(255,255,255,.04);border:1px solid rgba(0,212,255,.15);border-radius:16px;padding:14px 22px;text-align:center;backdrop-filter:blur(12px);min-width:90px}
.pstat-num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;line-height:1;margin-bottom:4px}
.pstat-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;font-weight:600}
.profile-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:32px}
.profile-socials{display:flex;gap:12px;flex-wrap:wrap}
.psoc{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#94a3b8;font-size:12px;font-weight:600;text-decoration:none;transition:all .25s;cursor:none}
.psoc:hover{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.3);color:#00d4ff;transform:translateY(-2px)}
.profile-upload-hint{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:#475569;text-align:center;max-width:220px;line-height:1.7;margin-top:-10px}
@media(max-width:768px){.profile-inner{grid-template-columns:1fr;gap:36px;text-align:center}.profile-photo-wrap{margin:0 auto}.profile-stats,.profile-actions,.profile-socials{justify-content:center}.profile-bio{max-width:100%}.profile-sec{padding:110px 20px 60px}.profile-photo-ring{width:220px;height:270px}}

/* ── Cards – shared dark glass ── */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px}
.proj-card{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:24px;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease,border-color .35s;cursor:none;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.proj-card:hover{transform:translateY(-10px) scale(1.01);box-shadow:0 0 40px rgba(0,212,255,.12),0 24px 60px rgba(0,0,0,.6);border-color:rgba(0,212,255,.3)}
.proj-hero{height:160px;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
.proj-badge{position:absolute;top:12px;right:12px;padding:4px 12px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;font-weight:600;backdrop-filter:blur(8px)}
.proj-body{padding:26px}
.proj-tag{display:inline-flex;padding:3px 10px;border-radius:100px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.18);font-size:10px;font-weight:600;color:#00d4ff;letter-spacing:.04em;margin:3px 2px}

/* ── Certs ── */
.cert-scroll{display:flex;gap:20px;overflow-x:auto;padding:8px 0 20px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.2) transparent}
.cert-card{min-width:260px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:26px;transition:transform .3s,box-shadow .3s,border-color .3s;cursor:none;flex-shrink:0;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.cert-card:hover{transform:translateY(-7px);box-shadow:0 0 32px rgba(0,212,255,.12),0 20px 50px rgba(0,0,0,.5);border-color:rgba(0,212,255,.25)}
.cert-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}

/* ── Skills ── */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.skill-group{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.4);transition:border-color .3s,box-shadow .3s}
.skill-group:hover{border-color:rgba(0,212,255,.2);box-shadow:0 0 28px rgba(0,212,255,.08)}
.chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:13px;font-weight:600;margin-bottom:8px;transition:all .25s;cursor:none;color:#cbd5e1}
.chip:hover{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.3);color:#00d4ff;transform:translateX(5px);box-shadow:0 0 14px rgba(0,212,255,.15)}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── Timeline ── */
.timeline{max-width:680px;margin:0 auto;position:relative}
.timeline::before{content:'';position:absolute;left:22px;top:0;bottom:0;width:1.5px;background:linear-gradient(180deg,rgba(0,212,255,.5),rgba(139,92,246,.4),transparent)}
.tl-item{display:flex;gap:36px;padding-bottom:40px;opacity:0;transform:translateX(-24px);transition:all .6s ease}
.tl-item.vis{opacity:1;transform:translateX(0)}
.tl-dot{width:46px;height:46px;border-radius:50%;background:rgba(5,8,20,.9);border:1.5px solid rgba(0,212,255,.3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;z-index:1;box-shadow:0 0 16px rgba(0,212,255,.2)}
.tl-card{flex:1;background:rgba(255,255,255,.03);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:22px;box-shadow:0 4px 24px rgba(0,0,0,.4)}

/* ── Achievements ── */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;max-width:820px}
.ach-card{background:rgba(255,255,255,.03);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:28px;text-align:center;transition:all .35s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.ach-card:hover{transform:translateY(-6px);border-color:rgba(0,212,255,.25);box-shadow:0 0 30px rgba(0,212,255,.12),0 16px 40px rgba(0,0,0,.5)}
.ach-num{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:700;line-height:1;margin-bottom:6px}

/* ── Contact ── */
.contact-card{background:rgba(255,255,255,.03);backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.12);border-radius:28px;padding:46px;max-width:680px;margin:0 auto;box-shadow:0 0 50px rgba(0,212,255,.06),0 24px 60px rgba(0,0,0,.5)}
.input-wrap{margin-bottom:18px}
.input-wrap label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#64748b;margin-bottom:7px;font-weight:600}
.input-wrap input,.input-wrap textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 16px;font-family:'Outfit',sans-serif;font-size:15px;color:#e2e8f0;outline:none;transition:border-color .25s,box-shadow .25s;resize:vertical}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:#475569}
.input-wrap input:focus,.input-wrap textarea:focus{border-color:rgba(0,212,255,.45);box-shadow:0 0 0 3px rgba(0,212,255,.09),0 0 20px rgba(0,212,255,.08)}
.social-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#94a3b8;font-size:13px;font-weight:600;text-decoration:none;transition:all .25s;cursor:none}
.social-link:hover{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.3);color:#00d4ff;transform:translateY(-2px);box-shadow:0 0 16px rgba(0,212,255,.15)}

/* ── Footer ── */
footer{padding:32px 48px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;background:rgba(5,8,20,.9);backdrop-filter:blur(14px);color:#475569}
.footer-copy{font-size:13px}

/* ── Back to top ── */
.btn-back-top{position:fixed;bottom:22px;right:22px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#8b5cf6);color:#050814;border:none;cursor:none;opacity:0;transition:all .35s;z-index:999;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;box-shadow:0 0 20px rgba(0,212,255,.4)}
.btn-back-top.show{opacity:1}
.btn-back-top:hover{transform:translateY(-3px);box-shadow:0 0 32px rgba(0,212,255,.6)}

/* ── Reveal Animations ── */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.reveal.vis{opacity:1;transform:translateY(0)}

/* ── Loader ── */
#loader{position:fixed;inset:0;background:linear-gradient(135deg,#050814,#0a0f1e);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .6s}
.loader-logo{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.05em}
.loader-track{width:200px;height:3px;background:rgba(0,212,255,.1);border-radius:3px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#8b5cf6,#e040fb);width:0%;transition:width .05s linear;border-radius:3px;box-shadow:0 0 10px #00d4ff}
.loader-txt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.25em;color:#00d4ff;opacity:.6}

@keyframes float-t{0%{transform:translateY(0)}100%{transform:translateY(-18px)}}

/* ── Glow pulse for hero pill dot ── */
@keyframes glowpulse{0%,100%{box-shadow:0 0 6px #00d4ff,0 0 14px #00d4ff44}50%{box-shadow:0 0 14px #00d4ff,0 0 30px #00d4ff66}}

/* ── Letter-by-letter name animation ── */
@keyframes letter-rise{0%{opacity:0;transform:translateY(32px) scale(.75);filter:blur(8px)}55%{opacity:1;transform:translateY(-5px) scale(1.06);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.typed-name .t-letter{display:inline-block;opacity:0;animation:letter-rise .6s cubic-bezier(.23,1,.32,1) forwards}
.typed-name .t-space{display:inline-block;width:.25em}

@media(max-width:768px){
  .nav{padding:16px 20px}
  .nav-links{display:none}
  .about-grid{grid-template-columns:1fr}
  .sec{padding:70px 20px}
  .hero{padding:100px 20px 70px}
  footer{padding:24px 20px;flex-direction:column;text-align:center}
}
</style>
</head>
<body>

function SkillBar({ label, pct, color }) {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting) setW(pct); }, { threshold: .2 });
    if(ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div className="skill-row" ref={ref}>
      <div className="skill-label">
        <span style={{color:'#334155'}}>{label}</span>
        <span style={{fontFamily:'JetBrains Mono',fontSize:'12px',color}}>{pct}%</span>
      </div>
      <div className="skill-track">
        <div className="skill-fill" style={{width:w+'%',background:`linear-gradient(90deg,${color},${color}88)`}}/>
      </div>
    </div>
  );
}

function Reveal({ children, delay=0 }) {
  const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if(e.isIntersecting) { setTimeout(() => { if(ref.current) ref.current.classList.add('vis'); }, delay); }
    }, { threshold:.1 });
    if(ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return <div className="reveal" ref={ref}>{children}</div>;
}

/* letter-by-letter name animation injected via TypedName component */
function TypedName({ text, className, baseDelay=0, delayStep=70 }) {
  return (
    <span className={'typed-name ' + (className||'')}>
      {text.split('').map((ch, i) =>
        ch === ' '
          ? <span key={i} className="t-space"/>
          : <span key={i} className="t-letter"
              style={{animationDelay:`${baseDelay + i*delayStep}ms`}}>
              {ch}
            </span>
      )}
    </span>
  );
}

                </div>
                {g.items.map(s => (
                  <div key={s} className="chip">
                    <div className="chip-dot" style={{background:g.color,boxShadow:`0 0 5px ${g.color}60`}}/>

            </Reveal>
          ))}
        </div>
      </div>
    </section>

}

function Experience() {
  const refs = useRef([]);
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('vis'); });
    }, {threshold:.18});
    refs.current.forEach(r => { if(r) obs.observe(r); });
    return () => obs.disconnect();
  }, []);
  return (
    <section id="experience" className="sec">
      <div className="sec-inner">
        <Reveal>
          <div style={{marginBottom:'52px'}}>
            <div className="sec-label">07 — Experience & Education</div>

              <div className="tl-card">
                <div style={{fontFamily:'JetBrains Mono',fontSize:'9px',letterSpacing:'.15em',color:t.dateColor,marginBottom:'7px',fontWeight:600}}>{t.date}</div>

                <p style={{color:t.orgColor,fontSize:'13px',fontWeight:'600',marginBottom:'8px'}}>{t.org}</p>
                <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:'1.7'}}>{t.detail}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

<script>
/* Custom cursor - safe DOM access */
document.addEventListener('DOMContentLoaded', function() {
  const dot = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  if(!dot || !ring) return;
  let mx=0, my=0, rx=0, ry=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
  (function animate() {
    dot.style.transform = `translate(${mx-5}px,${my-5}px)`;
    rx += (mx-rx) * .13;
    ry += (my-ry) * .13;
    ring.style.transform = `translate(${rx-16}px,${ry-16}px)`;
    requestAnimationFrame(animate);
  })();
});

/* Progress bar */
/* Progress bar & Back to top */
document.addEventListener('DOMContentLoaded', function() {
  try {
    const progressFill = document.querySelector('.progress-fill');
    if(progressFill) {
      window.addEventListener('scroll', () => {
        const scrolled = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
        progressFill.style.width = scrolled + '%';
      });
    }
  } catch(e) { console.error('Progress bar error:', e); }
  
  try {
    const backTop = document.createElement('button');
    backTop.className = 'btn-back-top';
    backTop.innerHTML = '↑';
    backTop.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
    document.body.appendChild(backTop);
    window.addEventListener('scroll', () => {
      if(window.scrollY > 300) backTop.classList.add('show');
      else backTop.classList.remove('show');
    });
  } catch(e) { console.error('Back to top error:', e); }
});

/* Loader */
(function(){
  try {
    const fill = document.getElementById('lfill');
    const txt = document.getElementById('ltxt');
    const loader = document.getElementById('loader');
    if(!fill || !txt || !loader) return;
    const stages = ['LOADING','PAINTING AURORA','BUILDING COMPONENTS','READY'];
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random()*14 + 5;
      if(p > 100) p = 100;
      fill.style.width = p + '%';
      txt.textContent = stages[Math.min(Math.floor(p/34), 3)];
      if(p >= 100) {
        clearInterval(iv);
        setTimeout(() => {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(() => loader.remove(), 700);
        }, 350);
      }
    }, 90);
  } catch(e) {
    console.error('Loader error:', e);
  }
})();
</script>
